# Non-secure kernel for source-built OP-TEE. The stock defconfig runs Linux secure
# with FIQ_DEBUGGER_FIQ_GLUE=y; under OP-TEE that must be off and the fiq-debugger
# routes through the secure monitor. Mirrors the vendor rv1106-tee.config deltas.
CONFIG_TEE=y
CONFIG_OPTEE=y
CONFIG_OPTEE_SHM_NUM_PRIV_PAGES=1
CONFIG_HW_RANDOM_OPTEE=y
CONFIG_ARM_PSCI=y
CONFIG_ARM_PSCI_FW=y
CONFIG_HAVE_ARM_SMCCC_DISCOVERY=y
CONFIG_ARM_SMCCC_SOC_ID=y
CONFIG_ARM_CPU_SUSPEND=y
# CONFIG_FIQ_DEBUGGER_FIQ_GLUE is not set
CONFIG_FIQ_DEBUGGER_TRUST_ZONE=y
